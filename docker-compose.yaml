version: "3.8"

services:
    mongodb:
        image: mongo:8
        container_name: mongodb
        restart: always
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: example
        volumes:
            - mongo-data:/data/db

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: nestjs-backend
        restart: always
        depends_on:
            - mongodb
        env_file:
            - ./backend/.env
        ports:
            - "8000:8000"
        networks:
            - app-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: nextjs-frontend
        restart: always
        depends_on:
            - backend
        env_file:
            - ./frontend/.env
        ports:
            - "3000:3000"
        networks:
            - app-network

volumes:
    mongo-data:

networks:
    app-network:
        driver: bridge
